interface:
  display_name: "Retain: design"
  short_description: "Write a design for a change here as a Retain build packet"
  icon_small: "./assets/icon-small.png"
  icon_large: "./assets/icon-large.png"
  brand_color: "#344A40"
  default_prompt: "Use $retain-design to write the design for this change as a Retain packet, in the direction we agreed."
policy:
  allow_implicit_invocation: false
dependencies:
  tools:
    - type: "mcp"
      value: "retain"
      description: "The Retain MCP server"
      transport: "streamable_http"
      url: "https://retainapp.ai/api/private/mcp"
