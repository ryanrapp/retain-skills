interface:
  display_name: "Retain: curate-work"
  short_description: "Curate this repository's Working packets, four at a time"
  icon_small: "./assets/icon-small.png"
  icon_large: "./assets/icon-large.png"
  brand_color: "#344A40"
  default_prompt: "Use $retain-curate-work to go through the Working packets in this repository."
policy:
  allow_implicit_invocation: false
dependencies:
  tools:
    - type: "mcp"
      value: "retain"
      description: "The Retain MCP server"
      transport: "streamable_http"
      url: "https://retainapp.ai/api/private/mcp"
